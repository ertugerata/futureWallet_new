# Alembic yapılandırması — FutureWallet
# Development ve production'da DATABASE_URL env değişkeni ile override edilir.

[alembic]
# Bu repo'da alembic/ dizinindeki migrations'ı kullan.
# Her çalışma anında env.py, config.get_main_option("sqlalchemy.url") okur.
# Production'da DATABASE_URL env'den gelir; development için varsayılan
# ./data/futurewallet.db (Prompt 6: kalıcılık).
#
# Not: Bu dosyada +git olduğu için DATABASE_URL burada değildir. env.py
# config.get_main_option("sqlalchemy.url") yerine
# os.environ.get("DATABASE_URL", "sqlite:///./data/futurewallet.db") kullanır.

# Tekrar uygulanabilir migration oluştururken:
#   alembic revision --autogenerate -m "tanımlar"
# Oluşturulan dosya alembic/versions/ altında görünür.
#
# Uygula:
#   alembic upgrade head
#
# Gerçekleştirme gerçeği:
#   alembic downgrade -1  (bir önceki versión'a geri)

# template_line
# (bu satır template varsayımıdır — yukarıdaki açıklamalar bu bölümde
# kalsın; Alembic [alembic] bölümünü aşağıdaki satırlarla kes.)

# pylint: disable=too-few-public-methods
# single-way yapılandırmalar aşağıda.

# ------------------------------------------------------------------
# [alembic] bölümü
# ------------------------------------------------------------------

script_location = alembic
prepend_sys_path = .
version_path_separator = os  # alembic/versions/ altında {version}.py dosyalarını arar

# SQLAlchemy URL: env.py bu değer yerine env değişkenini kullanır, ancak
# bu konfigürasyon dosyası'nın bir değer ile başlaması Alembic'in
# ??? nedeni ile başarısız olmasını engeller. Gerçek değer env.py'de.
sqlalchemy.url = driver://user:pass@localhost/dbname  # placeholder; env.py override eder

# Logger
log_level = WARNING

# ------------------------------------------------------------------
# [post_write_hooks] (opsiyonel — flake8/black/ruff)
# ------------------------------------------------------------------
# Her yeni migration dosyasını otomatik formatlamak için:
# [post_write_hooks]
# hooks = black,ruff
# black.type = black
# black.entrypoint = black
# black.options = -q
# ruff.type = ruff
# ruff.entrypoint = ruff
# ruff.options = check --fix
