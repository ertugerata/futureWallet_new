services:
  pocketbase:
    build:
      context: .
      dockerfile: ./docker/pocketbase/Dockerfile
    container_name: futurewallet-pb
    ports:
      - "127.0.0.1:8080:8090"
    volumes:
      - pb_data:/pb_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - POCKETBASE_EMAIL=${POCKETBASE_EMAIL:?required}
      - POCKETBASE_PASSWORD=${POCKETBASE_PASSWORD:?required}
      - PB_ALLOWED_ORIGINS=${PB_ALLOWED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  futurewallet:
    build: .
    container_name: futurewallet
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - POCKETBASE_URL=http://pocketbase:8090
      - POCKETBASE_PUBLIC_URL=${POCKETBASE_PUBLIC_URL:-http://127.0.0.1:8080}
      - POCKETBASE_EMAIL=${POCKETBASE_EMAIL:?required}
      - POCKETBASE_PASSWORD=${POCKETBASE_PASSWORD:?required}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_MODELS=${OPENROUTER_MODELS:-}
      - ENABLE_SCHEDULER=${ENABLE_SCHEDULER:-true}
      - TCMB_API_KEY=${TCMB_API_KEY:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - DEBUG=${DEBUG:-false}
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pb_data: