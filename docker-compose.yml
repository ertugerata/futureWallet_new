services:
  pocketbase:
    build:
      context: .
      dockerfile: ./docker/pocketbase/Dockerfile
    container_name: futurewallet-pb
    # run as root to avoid permission issues during init (can be removed later)
    #user: root
    ports:
      - "127.0.0.1:8080:8090"
    volumes:
      - pb_data:/pb_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8090/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - PB_REMOTE_ADDR=0.0.0.0:8090

  futurewallet:
    build: .
    container_name: futurewallet
    # run as root for same reason (can be changed to non‑root later)
    user: root
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - POCKETBASE_URL=http://pocketbase:8090
      - POCKETBASE_EMAIL=${POCKETBASE_EMAIL:?required}
      - POCKETBASE_PASSWORD=${POCKETBASE_PASSWORD:?required}
      - API_TOKEN=${API_TOKEN:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-google/gemini-2.0-flash}
      - TCMB_API_KEY=${TCMB_API_KEY:-}
      - FRED_API_KEY=${FRED_API_KEY:-}
      - DEBUG=${DEBUG:-false}
      - APP_HOST=127.0.0.1
      - APP_PORT=8000
    volumes:
      - pb_data:/app/data
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  pb_data:
