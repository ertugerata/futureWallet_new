# FutureWallet CI Workflow
# Prompt 15: ruff, mypy (gevşek), pytest, pip-audit, docker build

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  type-check:
    name: Mypy Type Check (Gevşek)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: Run mypy (gevşek - ignore missing imports)
        run: mypy --ignore-missing-imports --follow-imports=skip api/ services/ config.py

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache PocketBase binary
        uses: actions/cache@v4
        with:
          path: pb_bin
          key: pb-bin-${{ hashFiles('tests/conftest.py') }}

      - name: Import smoke check
        env:
          POCKETBASE_URL: http://127.0.0.1:8090
          POCKETBASE_EMAIL: ci@futurewallet.test
          POCKETBASE_PASSWORD: ci-dummy-password
        run: python -c "import api.app"

      - name: Run pytest
        run: pytest --tb=short -v

      - name: Run PB integration tests
        run: pytest -m pb --tb=short -v

  security:
    name: Pip Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          pip install -r requirements.txt

      - name: Run pip-audit
        run: pip-audit -r requirements.txt

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: futurewallet:ci-test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm -e POCKETBASE_URL=test futurewallet:ci-test python -c "print('Docker build successful')"
