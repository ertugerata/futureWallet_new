# Mypy configuration for FutureWallet (gevşek/loose mode)
# Prompt 15: mypy gevşek çalıştırılacak

[mypy]
ignore_missing_imports = true
follow_imports = skip

# Allow None returns for cleaner code (gevşek)
warn_return_any = false
warn_unused_configs = false

# Node-redefinition ve benzeri gevşek mod hatalarini ignore et
disable_error_code =
    no-redef,
    name-defined,
    attr-defined,
    return-value,
